<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מרחב שיח — מנהל/ת ורכזת הכלה והוגנות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --p:#1a4a7a;--pl:#2563a8;--t:#2a9d8f;--tl:#3fb5a7;
  --mint:#d4f5ee;--sand:#fef3e2;--sand2:#f5d99a;
  --pur:#7c6cf6;--pur2:#ede9fe;
  --bg:#f4f6fa;--card:#fff;--bdr:#dde3ee;
  --tx:#1a2540;--muted:#6b7a99;--light:#9ba8bf;
  --ok:#2da56e;--ok2:#d1fae5;--warn:#e97316;--warn2:#fff3e0;--red:#e53e3e;
  --r:14px;--rs:8px;--sh:0 2px 12px rgba(26,74,122,0.08);
}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--tx);direction:rtl;}
button,input,textarea,select{font-family:'Heebo',sans-serif;}
input,textarea,select{direction:rtl;}
button{cursor:pointer;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:230px;background:var(--p);color:#fff;position:fixed;top:0;right:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:100;}
.slogo{padding:18px 14px 12px;border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:9px;}
.sico{width:34px;height:34px;background:var(--t);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.stit{font-size:12px;font-weight:700;line-height:1.3;}
.ssub{font-size:11px;opacity:.6;margin-top:2px;}
.snav{padding:12px 9px;flex:1;}
.sstep{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:9px;margin-bottom:3px;cursor:pointer;transition:all .2s;font-size:13px;opacity:.6;}
.sstep:hover{background:rgba(255,255,255,.1);opacity:.85;}
.sstep.active{background:rgba(255,255,255,.15);opacity:1;font-weight:600;}
.sstep.done{opacity:.85;}
.snum{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.sstep.active .snum{background:var(--t);border-color:var(--t);}
.sstep.done .snum{background:var(--ok);border-color:var(--ok);}
.sbot{padding:12px 9px;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:4px;}
.dbtn{width:100%;padding:8px;border-radius:7px;border:none;background:rgba(255,255,255,.1);color:#fff;font-size:12px;cursor:pointer;transition:background .2s;display:flex;align-items:center;justify-content:center;gap:6px;}
.dbtn:hover{background:rgba(255,255,255,.18);}
.dbtn.primary{background:var(--t);}
.dbtn.primary:hover{background:var(--tl);}
.dbtn-row{display:flex;gap:4px;}
.dbtn-row .dbtn{flex:1;font-size:11px;}
.main{margin-right:230px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{background:#fff;border-bottom:1px solid var(--bdr);padding:11px 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 1px 8px rgba(0,0,0,.05);}
.ttit{font-size:14px;font-weight:700;color:var(--p);}
.tsch{font-size:12px;color:var(--muted);}
.pwrap{flex:1;max-width:260px;margin:0 18px;}
.ptrack{height:5px;background:var(--bdr);border-radius:99px;overflow:hidden;}
.pfill{height:100%;background:linear-gradient(90deg,var(--t),var(--p));border-radius:99px;transition:width .5s ease;}
.plbl{font-size:11px;color:var(--muted);margin-top:3px;text-align:center;}
.savestatus{font-size:11px;color:var(--ok);opacity:0;transition:opacity .3s;white-space:nowrap;}
.savestatus.show{opacity:1;}
.page{padding:26px;max-width:940px;margin:0 auto;width:100%;}
.page-wide{max-width:1200px;}
.ph h1{font-size:22px;font-weight:800;color:var(--p);margin-bottom:5px;}
.ph p{font-size:13px;color:var(--muted);line-height:1.6;max-width:600px;margin-bottom:22px;}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--bdr);box-shadow:var(--sh);padding:20px;margin-bottom:16px;}
.ch{display:flex;align-items:center;gap:11px;margin-bottom:16px;}
.ci{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.ct{font-size:15px;font-weight:700;color:var(--p);}
.cs{font-size:12px;color:var(--muted);margin-top:2px;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.full{grid-column:1/-1;}
.fgrp{display:flex;flex-direction:column;gap:5px;min-width:0;}
.flbl{font-size:13px;font-weight:600;color:var(--tx);}
.flbl-hint{font-size:11px;font-weight:400;color:var(--muted);margin-right:5px;}
.opt{font-weight:400;color:var(--muted);}
.finp{padding:9px 12px;border:1.5px solid var(--bdr);border-radius:var(--rs);font-size:14px;color:var(--tx);background:#fff;transition:border .2s;direction:rtl;width:100%;}
.finp:focus{outline:none;border-color:var(--t);box-shadow:0 0 0 3px rgba(42,157,143,.12);}
.fta{resize:vertical;min-height:60px;line-height:1.6;}
.divider{border:none;border-top:1px solid var(--bdr);margin:18px 0;}
/* ── CheckSelect Dropdown — FIXED OVERFLOW ── */
.dd-wrap{position:relative;margin-top:5px;width:100%;min-width:0;}
.dd-trigger{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:9px 13px;border:1.5px solid var(--bdr);border-radius:var(--rs);background:#fff;cursor:pointer;transition:border .2s;user-select:none;width:100%;min-height:40px;box-sizing:border-box;}
.dd-trigger:hover{border-color:var(--t);}
.dd-trigger.has-val{border-color:var(--t);background:#f7fffe;}
.dd-trigger.open{border-color:var(--t);border-bottom-left-radius:0;border-bottom-right-radius:0;}
.dd-left{display:flex;align-items:center;flex:1 1 0;min-width:0;overflow:hidden;}
.dd-placeholder{font-size:13px;color:var(--muted);}
.dd-tags{display:flex;flex-wrap:wrap;gap:4px;flex:1 1 0;min-width:0;width:100%;max-width:100%;}
.dd-tag{padding:2px 9px;background:var(--mint);border-radius:99px;font-size:12px;color:#065f46;border:1px solid #6ee7b7;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;}
.dd-tag-other{background:var(--pur2);color:#5b21b6;border-color:#c4b5fd;}
.dd-arrow{font-size:11px;color:var(--muted);flex-shrink:0;margin-right:6px;margin-top:4px;transition:transform .2s;}
.dd-trigger.open .dd-arrow{transform:rotate(180deg);}
.dd-count{font-size:11px;color:var(--t);font-weight:700;background:var(--mint);padding:1px 7px;border-radius:99px;flex-shrink:0;margin-top:2px;}
.dd-panel{display:none;position:absolute;top:100%;right:0;left:0;background:#fff;border:1.5px solid var(--t);border-top:none;border-bottom-left-radius:var(--rs);border-bottom-right-radius:var(--rs);z-index:200;box-shadow:0 6px 20px rgba(26,74,122,.12);max-height:320px;overflow-y:auto;}
.dd-panel.open{display:block;}
.dd-item{display:flex;align-items:center;gap:9px;padding:8px 13px;cursor:pointer;transition:background .12s;border-bottom:1px solid var(--bdr);font-size:13px;line-height:1.4;}
.dd-item:last-child{border-bottom:none;}
.dd-item:hover{background:#f0fdfa;}
.dd-item.on{background:#e8f8f5;}
.dd-box{width:16px;height:16px;border-radius:4px;border:2px solid var(--bdr);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;transition:all .15s;}
.dd-item.on .dd-box{background:var(--t);border-color:var(--t);color:#fff;}
.dd-other-item.on .dd-box{background:var(--pur);border-color:var(--pur);color:#fff;}
.dd-inp{margin:8px 12px 10px;border:1.5px dashed var(--t);border-radius:var(--rs);padding:7px 11px;font-size:13px;direction:rtl;width:calc(100% - 24px);background:#fff;}
.dd-inp:focus{outline:none;}
/* ── Goal suggestions ── */
.goal-sug{display:flex;flex-direction:column;gap:5px;margin-bottom:9px;}
.gsug{padding:9px 13px;background:linear-gradient(135deg,#f0fdf4,#ecfeff);border:1px dashed var(--t);border-radius:var(--rs);font-size:13px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:8px;user-select:none;}
.gsug:hover{background:var(--mint);border-style:solid;}
.gsug.active{background:var(--mint);border-style:solid;border-color:var(--t);box-shadow:0 0 0 3px rgba(42,157,143,.12);}
.gsug-ico{font-size:11px;font-weight:700;color:var(--t);flex-shrink:0;}
.gsug-free{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--sand);border:1.5px solid var(--sand2);border-radius:var(--rs);cursor:pointer;font-size:13px;color:#7c5c0e;font-weight:600;}
.guidance{background:linear-gradient(135deg,var(--sand),var(--mint));border-radius:var(--r);padding:15px 19px;margin-bottom:16px;border-right:4px solid var(--t);}
.guidance .gt{font-size:13px;font-weight:700;color:var(--p);margin-bottom:4px;}
.guidance p{font-size:13px;color:var(--tx);line-height:1.6;}
.zcard{background:var(--card);border-radius:var(--r);border:2px solid var(--bdr);padding:18px;margin-bottom:13px;transition:all .2s;}
.zcard.sel{border-color:var(--t);box-shadow:0 0 0 3px rgba(42,157,143,.1);}
.zh{display:flex;align-items:flex-start;gap:11px;margin-bottom:11px;}
.znum{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;}
.ztit{font-size:14px;font-weight:700;color:var(--p);line-height:1.35;}
.zdsc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;}
.zwhy{background:var(--pur2);border-radius:var(--rs);padding:9px 13px;margin-bottom:10px;font-size:12px;color:var(--tx);line-height:1.55;}
.exlbl{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px;}
.echip{padding:3px 9px;background:var(--bg);border:1px solid var(--bdr);border-radius:99px;font-size:12px;color:var(--muted);}
.focus-lbl{font-size:13px;font-weight:700;margin-bottom:7px;}
.focus-row{display:flex;gap:6px;}
.fbtn{flex:1;padding:8px 5px;border-radius:7px;border:2px solid var(--bdr);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;background:#fff;color:var(--muted);text-align:center;line-height:1.3;}
.fbtn:hover{border-color:var(--p);color:var(--p);}
.fbtn.fh{background:#fff0f0;border-color:#f87171;color:#c53030;}
.fbtn.fm{background:#fffbf0;border-color:#f59e0b;color:#92400e;}
.fbtn.fk{background:var(--ok2);border-color:#6ee7b7;color:#065f46;}
.fsub{font-size:10px;font-weight:400;opacity:.7;display:block;margin-top:1px;}
.cross-card{background:var(--pur2);border-radius:var(--r);padding:15px 19px;border:1px solid #c4b5fd;margin-bottom:13px;}
.xitem{display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:7px;border:2px solid var(--bdr);background:#fff;cursor:pointer;margin-bottom:6px;transition:all .2s;}
.xitem.active{border-color:var(--pur);background:#f5f3ff;}
.ztabs{display:flex;gap:5px;margin-bottom:16px;flex-wrap:wrap;}
.ztab{padding:7px 13px;border-radius:7px;border:2px solid var(--bdr);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;background:#fff;color:var(--muted);}
.ztab.active{color:#fff;border-color:transparent;}
.gbadge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700;margin-bottom:11px;}
.gb-req{background:var(--p);color:#fff;}
.gb-opt{background:var(--bdr);color:var(--muted);}
.type-btns{display:flex;gap:6px;margin-bottom:11px;}
.tbtn{padding:7px 14px;border-radius:7px;border:2px solid var(--bdr);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;background:#fff;color:var(--muted);}
.tbtn.tnew{background:#eff6ff;border-color:var(--pl);color:var(--p);}
.tbtn.tong{background:var(--sand);border-color:var(--sand2);color:#7c5c0e;}
.ongoing-box{background:var(--sand);border-radius:var(--rs);padding:13px;margin-bottom:11px;}
.scopes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px;}
.schip{padding:6px 12px;border-radius:7px;border:2px solid var(--bdr);font-size:12px;cursor:pointer;transition:all .2s;background:#fff;color:var(--muted);font-weight:500;}
.schip.active{background:var(--t);border-color:var(--t);color:#fff;font-weight:700;}
.at-lbl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--p);margin-bottom:7px;padding-bottom:5px;border-bottom:2px solid var(--bdr);}
.atdot{width:8px;height:8px;border-radius:50%;}
.action-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--rs);border:1.5px solid var(--bdr);cursor:pointer;transition:all .2s;background:#fff;margin-bottom:5px;}
.action-item:hover{border-color:var(--t);background:#f0fdfa;}
.action-item.ac{border-color:var(--p);background:#eff6ff;}
.action-item.as{border-color:var(--light);background:var(--bg);}
.acheck{width:16px;height:16px;border-radius:4px;border:2px solid var(--bdr);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;transition:all .2s;}
.ac .acheck{background:var(--p);border-color:var(--p);color:#fff;}
.as .acheck{background:var(--light);border-color:var(--light);color:#fff;}
.atag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--p);color:#fff;opacity:0;}
.ac .atag{opacity:1;}
.cin-row{display:flex;gap:6px;margin-top:7px;}
.addbtn{padding:7px 13px;background:var(--t);color:#fff;border:none;border-radius:var(--rs);font-size:12px;font-weight:600;white-space:nowrap;}
.addbtn:hover{background:var(--tl);}
.mchips{display:flex;flex-wrap:wrap;gap:6px;}
.mchip{padding:6px 12px;border-radius:99px;border:2px solid var(--bdr);font-size:12px;cursor:pointer;transition:all .2s;background:#fff;color:var(--muted);}
.mchip.am{background:var(--pur);border-color:var(--pur);color:#fff;font-weight:600;}
.mchip.ap{background:var(--t);border-color:var(--t);color:#fff;font-weight:600;}
/* ── Metric selector with X value ── */
.mline{display:flex;align-items:center;gap:8px;padding:10px 13px;border-radius:var(--rs);border:1.5px solid var(--bdr);background:#fff;margin-bottom:6px;cursor:pointer;transition:all .15s;}
.mline:hover{border-color:var(--t);}
.mline.on{border-color:var(--t);background:#f0fdfa;}
.mline .mchk{width:16px;height:16px;border-radius:4px;border:2px solid var(--bdr);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;}
.mline.on .mchk{background:var(--t);border-color:var(--t);color:#fff;}
.mline .mtx{flex:1;font-size:13px;line-height:1.5;display:flex;flex-wrap:wrap;align-items:center;gap:3px;}
.mxin{width:55px;padding:2px 6px;border:1.5px solid var(--t);border-radius:5px;font-size:13px;text-align:center;background:#fff;font-weight:700;color:var(--p);}
.cpgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;}
.cpcard{background:var(--bg);border-radius:var(--rs);padding:13px;border:1.5px solid var(--bdr);}
.cptit{font-size:12px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.cpdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.alert{padding:10px 14px;border-radius:var(--rs);margin-bottom:11px;font-size:13px;display:flex;gap:7px;align-items:flex-start;}
.alert.info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;}
.navbar{display:flex;justify-content:space-between;align-items:center;padding:16px 26px;background:#fff;border-top:1px solid var(--bdr);position:sticky;bottom:0;}
.btn-back{padding:10px 20px;border-radius:var(--rs);border:2px solid var(--bdr);font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--muted);transition:all .2s;}
.btn-back:hover{border-color:var(--p);color:var(--p);}
.btn-back:disabled{opacity:.4;cursor:not-allowed;}
.btn-next{padding:10px 24px;border-radius:var(--rs);border:none;font-size:14px;font-weight:700;cursor:pointer;background:var(--p);color:#fff;transition:all .2s;}
.btn-next:hover{background:var(--pl);}
.btn-next:disabled{opacity:.4;cursor:not-allowed;}
/* ── SUMMARY / TABLE ── */
.shd{background:linear-gradient(135deg,var(--p) 0%,var(--t) 100%);color:#fff;border-radius:var(--r);padding:24px 28px;margin-bottom:20px;}
.shd h2{font-size:21px;font-weight:800;margin-bottom:3px;}
.shd p{opacity:.85;font-size:14px;}
.smeta{display:flex;flex-wrap:wrap;gap:14px;margin-top:13px;}
.smi{display:flex;align-items:center;gap:5px;font-size:13px;}
.view-tabs{display:flex;gap:5px;margin-bottom:16px;}
.vtab{padding:7px 15px;border-radius:7px;border:2px solid var(--bdr);background:#fff;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;}
.vtab.active{background:var(--p);border-color:var(--p);color:#fff;}
.ptbl-wrap{background:#fff;border-radius:var(--r);border:1px solid var(--bdr);overflow-x:auto;margin-bottom:16px;box-shadow:var(--sh);}
.ptbl{width:100%;border-collapse:collapse;min-width:900px;font-size:12px;}
.ptbl th{background:var(--p);color:#fff;padding:10px 8px;text-align:right;font-size:12px;font-weight:700;border-left:1px solid rgba(255,255,255,.15);position:sticky;top:0;z-index:5;}
.ptbl td{padding:10px 8px;border-bottom:1px solid var(--bdr);border-left:1px solid var(--bdr);vertical-align:top;line-height:1.5;background:#fff;}
.ptbl tr:nth-child(even) td{background:#fafbfd;}
.ptbl .zcell{font-weight:700;color:var(--p);white-space:nowrap;border-right:4px solid;}
.ptbl .gcell{font-weight:600;min-width:180px;}
.ptbl .note-cell{min-width:160px;}
.ptbl ul{list-style:none;padding:0;margin:0;}
.ptbl ul li{padding:2px 0;font-size:11px;}
.ptbl ul li::before{content:"• ";color:var(--t);font-weight:700;}
.note-txt{width:100%;min-height:60px;border:1.5px dashed var(--bdr);border-radius:5px;padding:6px;font-size:11px;font-family:'Heebo',sans-serif;direction:rtl;background:#fff9e6;resize:vertical;}
.note-txt:focus{outline:none;border-color:var(--warn);background:#fff;}
.szone{background:var(--card);border-radius:var(--r);border:1px solid var(--bdr);margin-bottom:16px;overflow:hidden;}
.szh{padding:13px 19px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bdr);}
.szb{padding:17px 19px;}
.sgoal{margin-bottom:16px;padding-bottom:13px;border-bottom:1px solid var(--bdr);}
.sgoal:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none;}
.sgt{font-size:14px;font-weight:700;color:var(--p);margin-bottom:8px;}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px;}
.sf label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px;}
.sf p{font-size:13px;color:var(--tx);line-height:1.5;}
.stags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;}
.tb{background:#dbeafe;color:var(--p);}
.tt{background:var(--mint);color:#065f46;}
.tpu{background:var(--pur2);color:#5b21b6;}
.ts{background:var(--sand);color:#7c5c0e;}
/* ── Modal ── */
.modal-bk{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;align-items:center;justify-content:center;}
.modal-bk.open{display:flex;}
.modal{background:#fff;border-radius:var(--r);padding:24px;max-width:480px;width:90%;box-shadow:0 20px 40px rgba(0,0,0,.2);}
.modal h3{font-size:16px;font-weight:700;color:var(--p);margin-bottom:8px;}
.modal p{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.6;}
.modal-act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
.modal-btn{padding:8px 16px;border-radius:var(--rs);border:2px solid var(--bdr);background:#fff;font-size:13px;font-weight:600;cursor:pointer;}
.modal-btn.primary{background:var(--p);border-color:var(--p);color:#fff;}

// SAVE / LOAD (localStorage + JSON import/export)
// ═══════════════════════════════════════════════════════════════════════════════
const LS_KEY = "merchav_siach_state_v2";
let saveTimer = null;

function showSaveStatus(txt, ok){
  const el = document.getElementById("saveStatus");
  if(!el) return;
  el.textContent = txt || "✓ נשמר";
  el.style.color = ok === false ? "var(--red)" : "var(--ok)";
  el.classList.add("show");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>el.classList.remove("show"), 1500);
}
function saveToLS(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){ console.warn("LS save failed", e); }
}
let autoSaveTimer=null;
function autoSave(){
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(()=>{ saveToLS(); }, 500);
}
function saveNow(){ saveToLS(); showSaveStatus("✓ נשמר בדפדפן"); }
function loadFromLS(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const obj = JSON.parse(raw);
    if(obj && obj.setup && obj.zones){ S = obj; return true; }
  } catch(e){ console.warn("LS load failed", e); }
  return false;
}
function confirmReload(){
  openModal("טעינת תוכנית שמורה", "לטעון את התוכנית השמורה האחרונה מהדפדפן? שינויים לא-שמורים יימחקו.", ()=>{
    if(loadFromLS()){ render(); showSaveStatus("✓ נטען"); }
    else { showSaveStatus("⚠ אין תוכנית שמורה", false); }
  });
}
function confirmReset(){
  openModal("איפוס התוכנית", "לאפס את כל הנתונים? (גם השמירה בדפדפן תימחק)", ()=>{
    localStorage.removeItem(LS_KEY);
    S = defaultState();
    render();
    showSaveStatus("✓ אופס");
  }, true);
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const school = (S.setup.school||"תוכנית").replace(/[^\u0590-\u05FFa-zA-Z0-9_-]/g,"_");
  a.href = url;
  a.download = `merchav_siach_${school}_${S.setup.year||""}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();}, 100);
  showSaveStatus("⬇ הורד");
}
function importJSON(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const obj = JSON.parse(e.target.result);
      if(obj && obj.setup && obj.zones){ S = obj; saveToLS(); render(); showSaveStatus("✓ יובא"); }
      else { alert("קובץ לא תקין — חסרים שדות נדרשים."); }
    } catch(err){ alert("שגיאה בקריאת הקובץ: "+err.message); }
  };
  reader.readAsText(file, "utf-8");
  evt.target.value = ""; // reset so same file can be re-uploaded
}

function h(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function csText(v){
  if(!v) return "";
  if(typeof v==="string") return v;
  const parts=[...(v.items||[]).filter(x=>x!=="__other__")];
  if(v.other) parts.push(v.other);
  return parts.join(" | ");
}
function csHasValue(v){if(!v) return false;if(typeof v==="string") return !!v;return (v.items&&v.items.length>0)||!!v.other;}
function csList(v){
  if(!v) return [];
  if(typeof v==="string") return v?[v]:[];
  const arr=[...(v.items||[]).filter(x=>x!=="__other__")];
  if(v.other) arr.push(v.other);
  return arr;
}

// DROPDOWN (CheckSelect)
// ═══════════════════════════════════════════════════════════════════════════════
function ddId(prefix){return "dd_"+prefix.replace(/[^a-z0-9]/gi,"_");}
function toggleDD(id){
  const panel=document.getElementById(id+"_panel");
  const trigger=document.getElementById(id+"_trigger");
  if(!panel||!trigger)return;
  const isOpen=panel.classList.contains("open");
  document.querySelectorAll(".dd-panel.open").forEach(p=>{
    p.classList.remove("open");
    const t=document.getElementById(p.id.replace("_panel","_trigger"));
    if(t)t.classList.remove("open");
  });
  if(!isOpen){panel.classList.add("open");trigger.classList.add("open");}
}
document.addEventListener("click",function(e){
  if(!e.target.closest(".dd-wrap")){
    document.querySelectorAll(".dd-panel.open").forEach(p=>{
      p.classList.remove("open");
      const t=document.getElementById(p.id.replace("_panel","_trigger"));
      if(t)t.classList.remove("open");
    });
  }
});

function renderDDBody(uid, items, other, options){
  const selected = items.filter(x=>x!=="__other__");
  const showOther = items.includes("__other__");
  const hasVal = selected.length>0 || !!other;
  const id = ddId(uid);
  return `<div class="dd-wrap" onclick="event.stopPropagation()">
      <div class="dd-trigger ${hasVal?"has-val":""}" id="${id}_trigger" onclick="toggleDD('${id}')">
        <div class="dd-left">
          ${hasVal
            ? `<div class="dd-tags">
                 ${selected.map(i=>`<span class="dd-tag" title="${h(i)}">${h(i)}</span>`).join("")}
                 ${other?`<span class="dd-tag dd-tag-other" title="${h(other)}">${h(other)}</span>`:""}
               </div>`
            : `<span class="dd-placeholder">בחרי אפשרויות...</span>`
          }
        </div>
        ${hasVal?`<span class="dd-count">${selected.length+(other?1:0)}</span>`:""}
        <span class="dd-arrow">▾</span>
      </div>
      <div class="dd-panel" id="${id}_panel">
        ${options.map((opt,i)=>`
          <div class="dd-item ${items.includes(opt)?"on":""}" data-idx="${i}" onclick="__ddToggle('${uid}',${i})">
            <span class="dd-box">${items.includes(opt)?"✓":""}</span>
            <span>${h(opt)}</span>
          </div>`).join("")}
        <div class="dd-item dd-other-item ${showOther?"on":""}" onclick="__ddToggleOther('${uid}')">
          <span class="dd-box" style="${showOther?"background:var(--pur);border-color:var(--pur);color:#fff":""}">✎</span>
          <span style="color:${showOther?"var(--pur)":"var(--muted)"}">אחר — ניסוח חופשי</span>
        </div>
        ${showOther?`<input class="dd-inp" placeholder="כתבי ניסוח קצר ומדויק..." value="${h(other)}" oninput="__ddSetOther('${uid}',this.value)" onclick="event.stopPropagation()">`:""}
      </div>
    </div>`;
}

// Registry for dropdown callbacks
const _ddRegistry = {};
function __ddToggle(uid, optIdx){
  const reg = _ddRegistry[uid]; if(!reg) return;
  const opt = reg.options[optIdx];
  const v = reg.get() || {items:[],other:""};
  const its = [...(v.items||[])];
  let newVal;
  if(its.includes(opt)){ newVal = {...v, items: its.filter(x=>x!==opt)}; }
  else { newVal = {...v, items:[...its, opt]}; }
  reg.set(newVal);
  _ddRefresh(uid);
  autoSave();
}
function __ddToggleOther(uid){
  const reg = _ddRegistry[uid]; if(!reg) return;
  const v = reg.get() || {items:[],other:""};
  const its = [...(v.items||[])];
  let newVal;
  if(its.includes("__other__")){ newVal = {...v, items: its.filter(x=>x!=="__other__"), other:""}; }
  else { newVal = {...v, items:[...its, "__other__"]}; }
  reg.set(newVal);
  _ddRefresh(uid);
  autoSave();
}
function __ddSetOther(uid, val){
  const reg = _ddRegistry[uid]; if(!reg) return;
  const v = reg.get() || {items:[],other:""};
  reg.set({...v, other: val});
  autoSave();
}
function _ddRefresh(uid){
  const reg = _ddRegistry[uid]; if(!reg) return;
  const v = reg.get() || {items:[],other:""};
  const items = v.items || [];
  const other = v.other || "";
  const selected = items.filter(x=>x!=="__other__");
  const showOther = items.includes("__other__");
  const hasVal = selected.length>0 || !!other;
  const id = ddId(uid);
  const trigger = document.getElementById(id+"_trigger");
  if(trigger){
    const left = trigger.querySelector(".dd-left");
    if(left){
      left.innerHTML = hasVal
        ? `<div class="dd-tags">${selected.map(i=>`<span class="dd-tag" title="${h(i)}">${h(i)}</span>`).join("")}${other?`<span class="dd-tag dd-tag-other" title="${h(other)}">${h(other)}</span>`:""}</div>`
        : `<span class="dd-placeholder">בחרי אפשרויות...</span>`;
    }
    trigger.classList.toggle("has-val", hasVal);
    // update count
    let countEl = trigger.querySelector(".dd-count");
    const count = selected.length + (other?1:0);
    if(countEl){ countEl.textContent = count; countEl.style.display = count>0 ? "" : "none"; }
    else if(count>0){
      const arrow = trigger.querySelector(".dd-arrow");
      if(arrow){ const c=document.createElement("span"); c.className="dd-count"; c.textContent=count; trigger.insertBefore(c,arrow); }
    }
  }
  const panel = document.getElementById(id+"_panel");
  if(panel){
    panel.querySelectorAll(".dd-item:not(.dd-other-item)").forEach((el,i)=>{
      const isOn = items.includes(reg.options[i]);
      el.classList.toggle("on", isOn);
      const box = el.querySelector(".dd-box");
      if(box) box.textContent = isOn?"✓":"";
    });
    const otherItem = panel.querySelector(".dd-other-item");
    if(otherItem){
      otherItem.classList.toggle("on", showOther);
      const ob = otherItem.querySelector(".dd-box");
      if(ob){ ob.textContent = showOther?"✓":"✎"; ob.style = showOther ? "background:var(--pur);border-color:var(--pur);color:#fff" : ""; }
    }
    let inp = panel.querySelector(".dd-inp");
    if(showOther && !inp){
      inp = document.createElement("input"); inp.className="dd-inp";
      inp.placeholder="כתבי ניסוח קצר ומדויק..."; inp.value = other;
      inp.addEventListener("input", function(){ __ddSetOther(uid, this.value); });
      inp.addEventListener("click", function(e){ e.stopPropagation(); });
      panel.appendChild(inp);
    } else if(!showOther && inp){ inp.remove(); }
  }
}

function renderDDField(uid, options, label, full, getter, setter){
  _ddRegistry[uid] = { options, get: getter, set: setter };
  const v = getter() || {items:[],other:""};
  return `<div class="fgrp${full?" full":""}">
    <label class="flbl">${label}</label>
    ${renderDDBody(uid, v.items||[], v.other||"", options)}
  </div>`;
}

// Helpers to render fields backed by S
function renderCS(zid, gk, field, options, label, full){
  const uid = `${zid}_${gk}_${field}`;
  return renderDDField(uid, options, label, full,
    ()=>S.zones[zid][gk][field],
    (v)=>{ S.zones[zid][gk][field] = v; }
  );
}
function renderSetupCS(field, options, label, full){
  const uid = "setup_"+field;
  return renderDDField(uid, options, label, full,
    ()=>S.setup[field],
    (v)=>{ S.setup[field] = v; }
  );
}

// RENDER
// ═══════════════════════════════════════════════════════════════════════════════
function render(){
  renderSidebar(); refreshTopBar();
  const c = document.getElementById("content");
  if(S.step===1) c.innerHTML = renderS1();
  else if(S.step===2) c.innerHTML = renderS2();
  else if(S.step===3) c.innerHTML = renderS3();
  else if(S.step===4) c.innerHTML = renderS4();
  else if(S.step===5) c.innerHTML = renderS5();
  else c.innerHTML = renderS6();
  updateNav();
  autoSave();
}
function renderSidebar(){
  document.getElementById("snav").innerHTML = STEPS.map(s=>`
    <div class="sstep ${S.step===s.id?"active":""} ${S.step>s.id?"done":""}" onclick="gotoStep(${s.id})">
      <div class="snum">${S.step>s.id?"✓":s.id}</div><span>${s.l}</span>
    </div>`).join("");
}
function refreshTopBar(){
  document.getElementById("toptitle").textContent = STEPS[S.step-1].i+" "+STEPS[S.step-1].l;
  document.getElementById("topschool").textContent = S.setup.school ? (S.setup.school+" · "+S.setup.year) : "";
  document.getElementById("pfill").style.width = ((S.step-1)/5*100)+"%";
  document.getElementById("plbl").textContent = "שלב "+S.step+" מתוך 6";
}
function updateNav(){
  document.getElementById("btnBack").disabled = S.step===1;
  const next = document.getElementById("btnNext");
  const msg = document.getElementById("navMsg");
  if(S.step<6){ next.textContent="הבא ←"; next.disabled=false; msg.textContent=""; }
  else { next.textContent="🖨️ הדפסה"; next.disabled=false; msg.textContent=""; }
}
function prevStep(){ if(S.step>1){ S.step--; render(); } }
function nextStep(){ if(S.step<6){ S.step++; render(); } else if(S.step===6){ window.print(); } }
// FIXED: sidebar navigation — always navigate
function gotoStep(n){ S.step = n; render(); }
function setTab(t){ S.tab = t; render(); }
function setView(v){ S.view = v; render(); }
function loadDemo(){ S = JSON.parse(JSON.stringify(DEMO)); saveToLS(); render(); showSaveStatus("✓ דוגמה נטענה"); }

// Parses a metric string, returning array of chunks where "X" tokens become inputs
function renderMetricLine(zid, gk, listKey, metricIdx, itemValue){
  const g = S.zones[zid][gk];
  const arr = g[listKey] || [];
  const existing = arr.find(m => m.text === itemValue);
  const isOn = !!existing;
  const xVal = existing ? (existing.x||"") : "";
  // Render text with X replaced by input if on
  const parts = itemValue.split(/\bX\b/);
  const rendered = parts.map((p,i)=>{
    if(i===0) return h(p);
    if(isOn){
      // Put input before this part
      return `<input class="mxin" type="text" value="${h(xVal)}" onclick="event.stopPropagation()" oninput="setMetricX('${zid}','${gk}','${listKey}',${metricIdx},this.value)" placeholder="X"> ${h(p)}`;
    } else {
      return `<strong style="color:var(--t)">X</strong>${h(p)}`;
    }
  }).join("");
  return `<div class="mline ${isOn?"on":""}" onclick="toggleMetric('${zid}','${gk}','${listKey}',${metricIdx})">
    <span class="mchk">${isOn?"✓":""}</span>
    <span class="mtx">${rendered}</span>
  </div>`;
}

function toggleMetric(zid, gk, listKey, metricIdx){
  const zoneId = zid;
  // Map listKey to bank source
  let bank;
  if(listKey==="outputMetrics") bank = ZONE_BANKS[zoneId].outputMetrics;
  else if(listKey==="outcomeMetrics") bank = ZONE_BANKS[zoneId].outcomeMetrics;
  else return;
  const text = bank[metricIdx];
  const g = S.zones[zid][gk];
  const arr = [...(g[listKey]||[])];
  const existingIdx = arr.findIndex(m=>m.text===text);
  if(existingIdx>=0){ arr.splice(existingIdx,1); }
  else { arr.push({text, x:""}); }
  g[listKey] = arr;
  render();
}
function setMetricX(zid, gk, listKey, metricIdx, val){
  let bank;
  if(listKey==="outputMetrics") bank = ZONE_BANKS[zid].outputMetrics;
  else if(listKey==="outcomeMetrics") bank = ZONE_BANKS[zid].outcomeMetrics;
  else return;
  const text = bank[metricIdx];
  const g = S.zones[zid][gk];
  const arr = [...(g[listKey]||[])];
  const idx = arr.findIndex(m=>m.text===text);
  if(idx>=0){ arr[idx] = {...arr[idx], x:val}; g[listKey]=arr; autoSave(); }
}
function addCustomMetric(zid, gk, listKey){
  const el = document.getElementById(`cm_${zid}_${gk}_${listKey}`);
  if(!el || !el.value.trim()) return;
  const g = S.zones[zid][gk];
  const key = listKey==="outputMetrics" ? "customOutput" : "customOutcome";
  g[key] = [...(g[key]||[]), el.value.trim()];
  el.value="";
  render();
}
function removeCustomMetric(zid, gk, listKey, i){
  const g = S.zones[zid][gk];
  const key = listKey==="outputMetrics" ? "customOutput" : "customOutcome";
  g[key] = (g[key]||[]).filter((_,idx)=>idx!==i);

}

function metricList(arr){

  if(Array.isArray(list) && list.length>1){
    return `<div class="sf"><label>${label}</label><div class="stags">${list.map(p=>`<span class="tag tt">${h(p)}</span>`).join("")}</div></div>`;
  }
  return `<div class="sf"><label>${label}</label><p>${h(txt)}</p></div>`;
}
function renderGoalCard(g, gl, zone){
  const coreA=[...(g.coreActions||[]),...(g.customCore||[])];
  const suppA=[...(g.suppActions||[]),...(g.customSupp||[])];
  const outputList = [...metricList(g.outputMetrics), ...(g.customOutput||[])];
  const outcomeList = [...metricList(g.outcomeMetrics), ...(g.customOutcome||[])];
  return `<div class="sgoal">
    <div class="sgt">${gl}: ${h(g.text)}
      <span style="margin-right:7px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:${g.type==='new'?'#dbeafe':'#fef3c7'};color:${g.type==='new'?'var(--p)':'#92400e'}">${g.type==='new'?'יעד חדש':'יעד מתמשך'}</span>
    </div>
    <div class="sgrid">
      ${g.scope&&g.scope.length?`<div class="sf"><label>רמת יישום</label><div class="stags">${g.scope.map(s=>`<span class="tag tt">${s}</span>`).join("")}</div></div>`:""}
      ${fld("תוצאה רצויה",g.desiredState)}
      ${fld("מצב קיים",g.currentState)}
      ${fld("בסיס נתוני",g.dataBase)}
      ${fld("על מי חל",g.targetResult)}
      ${g.type==='ongoing'&&csHasValue(g.ongoingDone)?fld("מה הושג",g.ongoingDone):""}
      ${g.type==='ongoing'&&csHasValue(g.ongoingAdd)?fld("מה מוסיפים",g.ongoingAdd):""}
    </div>
    ${coreA.length?`<div style="margin-bottom:8px"><label style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:4px">פעולות מרכזיות</label><div class="stags">${coreA.map(a=>`<span class="tag tb">${h(a)}</span>`).join("")}</div></div>`:""}
    ${suppA.length?`<div style="margin-bottom:8px"><label style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:4px">פעולות משלימות</label><div class="stags">${suppA.map(a=>`<span class="tag ts">${h(a)}</span>`).join("")}</div></div>`:""}
    <div class="sgrid">
      ${g.methods&&g.methods.length?`<div class="sf"><label>מתודות</label><div class="stags">${g.methods.map(m=>`<span class="tag tpu">${h(m)}</span>`).join("")}</div></div>`:""}
      ${g.partners&&g.partners.length?`<div class="sf"><label>שותפים</label><div class="stags">${g.partners.map(p=>`<span class="tag tt">${h(p)}</span>`).join("")}</div></div>`:""}
      ${outputList.length?`<div class="sf"><label>📊 מדדי תפוקה</label><div class="stags">${outputList.map(m=>`<span class="tag tb">${h(m)}</span>`).join("")}</div></div>`:""}
      ${outcomeList.length?`<div class="sf"><label>🎯 מדדי תוצאה</label><div class="stags">${outcomeList.map(m=>`<span class="tag tb">${h(m)}</span>`).join("")}</div></div>`:""}
      ${g.evalMethods&&g.evalMethods.length?`<div class="sf"><label>🔎 דרכי הערכה</label><div class="stags">${g.evalMethods.map(m=>`<span class="tag ts">${h(m)}</span>`).join("")}</div></div>`:""}
    </div>
    ${g.cp&&g.cp.some(c=>c.w||c.d)?`<div><label style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:7px">נקודות בקרה</label>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      ${g.cp.map((c,i)=>(c.w||c.d||c.who)?`<div style="background:var(--bg);border-radius:7px;padding:10px;border-top:3px solid ${CP_C[i]}">
        <div style="font-weight:700;font-size:11px;color:${CP_C[i]};margin-bottom:5px">${CP_L[i]}</div>
        ${c.w?`<div style="font-size:11px;margin-bottom:3px"><strong>בודקים:</strong> ${h(c.w)}</div>`:""}
        ${c.d?`<div style="font-size:11px;margin-bottom:3px"><strong>נתונים:</strong> ${h(c.d)}</div>`:""}
        ${c.who?`<div style="font-size:11px;margin-bottom:3px"><strong>משתתפים:</strong> ${h(c.who)}</div>`:""}
        ${c.dec?`<div style="font-size:11px"><strong>החלטות:</strong> ${h(c.dec)}</div>`:""}
      </div>`:"").join("")}
    </div></div>`:""}
    ${g.notes?`<div style="margin-top:10px;padding:10px;background:#fff9e6;border-right:3px solid var(--warn);border-radius:5px"><small style="color:#7c5c0e;font-weight:700">📝 הערות:</small><div style="font-size:12px;margin-top:3px">${h(g.notes).replace(/\n/g,'<br>')}</div></div>`:""}
  </div>`;
}

function renderSetupSummary(){
  const setup=S.setup;
  if(!csHasValue(setup.situation)&&!csHasValue(setup.challenges)&&!csHasValue(setup.strengths)) return "";
  return `<div class="card">
    <div class="ch" style="margin-bottom:11px"><div class="ci" style="background:#f0fdfa">🔍</div><div class="ct">תמונת מצב ראשונית</div></div>
    <div class="sgrid">
      ${csHasValue(setup.situation)?`<div class="sf"><label>נתונים מרכזיים</label><div class="stags">${csList(setup.situation).map(t=>`<span class="tag tt">${h(t)}</span>`).join("")}</div></div>`:""}
      ${csHasValue(setup.processes)?`<div class="sf"><label>תהליכים קיימים</label><div class="stags">${csList(setup.processes).map(t=>`<span class="tag tt">${h(t)}</span>`).join("")}</div></div>`:""}
      ${setup.practices?`<div class="sf"><label>פרקטיקות</label><p>${h(setup.practices)}</p></div>`:""}
      ${csHasValue(setup.insights)?`<div class="sf"><label>תובנות</label><div class="stags">${csList(setup.insights).map(t=>`<span class="tag tpu">${h(t)}</span>`).join("")}</div></div>`:""}
      ${csHasValue(setup.challenges)?`<div class="sf"><label>אתגרים</label><div class="stags">${csList(setup.challenges).map(t=>`<span class="tag ts">${h(t)}</span>`).join("")}</div></div>`:""}
      ${csHasValue(setup.strengths)?`<div class="sf"><label>חוזקות ומשאבים</label><div class="stags">${csList(setup.strengths).map(t=>`<span class="tag tb">${h(t)}</span>`).join("")}</div></div>`:""}
      ${setup.meetings?`<div class="sf"><label>סדירויות</label><p>${h(setup.meetings)}</p></div>`:""}
    </div>
  </div>`;
}
function renderCrossSummary(){
  if(!S.cross||!S.cross.length) return "";
  return `<div class="card">
    <div class="ch" style="margin-bottom:11px"><div class="ci" style="background:var(--pur2)">🔗</div><div class="ct">רווחים נלווים</div></div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      ${S.cross.map(id=>{const ca=CROSS.find(c=>c.id===id);return ca?`<div style="padding:8px 14px;background:var(--pur2);border-radius:7px;border:1px solid #c4b5fd"><span style="font-size:14px;margin-left:5px">${ca.icon}</span><strong style="font-size:13px">${ca.title}</strong><span style="font-size:12px;color:var(--muted);margin-right:5px">— ${ca.desc}</span></div>`:"";}).join("")}
    </div>
  </div>`;
}

function renderZTabs(){
  return `<div class="ztabs">${ZONES.map(z=>`
    <button class="ztab ${S.tab===z.id?"active":""}" style="${S.tab===z.id?"background:"+z.color:""}" onclick="setTab('${z.id}')">
      ${S.zones[z.id].g1.text?"✓ ":""}${z.num}. ${z.title.split(" ").slice(0,3).join(" ")}...
    </button>`).join("")}</div>`;
}

// ═══════════════════════════════════════════════════════════════════════════════
// BOOTSTRAP
// ═══════════════════════════════════════════════════════════════════════════════
// Try to restore from localStorage on load
if(loadFromLS()){
  // restored — ensure backward-compatible structure
  const zs = S.zones;
  Object.keys(zs).forEach(zid=>{
    ["g1","g2"].forEach(gk=>{
      const g = zs[zid][gk];
      if(!g) return;
      if(!Array.isArray(g.outputMetrics)) g.outputMetrics = [];
      if(!Array.isArray(g.outcomeMetrics)) g.outcomeMetrics = [];
      if(!Array.isArray(g.customOutput)) g.customOutput = [];
      if(!Array.isArray(g.customOutcome)) g.customOutcome = [];
      if(g.notes == null) g.notes = "";
    });
  });
  if(S.planNotes == null) S.planNotes = "";
  if(!S.view) S.view = "table";
}
render();
</script>
